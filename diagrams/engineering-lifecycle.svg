<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">Civic Utility Monitor engineering lifecycle</title><desc id="desc">Product invariants lead to implementation, deterministic tests, readiness audit, pull request and security gates, controlled deployment, and production verification, with failures returning to focused remediation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F0FDFA"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker></defs><rect width="1600" height="620" rx="32" fill="url(#bg)"/><text x="80" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">Engineering lifecycle: evidence before promotion</text><text x="80" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">A failed test or review returns the change to a focused remediation loop; it is not edited away to obtain a green dashboard.</text><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="55" y="205" width="190" height="130" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Product</text><text x="150" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">invariant</text><text x="150" y="311" text-anchor="middle" font-size="14" fill="#64748B">Expected behavior first</text><rect x="275" y="205" width="190" height="130" rx="20" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="370" y="266" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">Implementation</text><text x="370" y="300" text-anchor="middle" font-size="14" fill="#64748B">Focused change</text><rect x="495" y="205" width="190" height="130" rx="20" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><text x="590" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Deterministic</text><text x="590" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">tests</text><text x="590" y="311" text-anchor="middle" font-size="14" fill="#64748B">Positive + adversarial</text><rect x="715" y="185" width="210" height="170" rx="22" fill="#0F766E" stroke="#115E59" stroke-width="2"/><text x="820" y="239" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Readiness</text><text x="820" y="267" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">audit</text><line x1="760" y1="285" x2="880" y2="285" stroke="#5EEAD4" stroke-opacity=".45"/><text x="820" y="313" text-anchor="middle" font-size="14" fill="#CCFBF1">PASS · FAIL · UNVERIFIED</text><text x="820" y="336" text-anchor="middle" font-size="14" fill="#CCFBF1">No forced green result</text><rect x="955" y="205" width="200" height="130" rx="20" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/><text x="1055" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">PR · CI</text><text x="1055" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">security gates</text><text x="1055" y="311" text-anchor="middle" font-size="14" fill="#64748B">Independent controls</text><rect x="1185" y="205" width="180" height="130" rx="20" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/><text x="1275" y="253" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Controlled</text><text x="1275" y="280" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">deployment</text><text x="1275" y="311" text-anchor="middle" font-size="14" fill="#64748B">Exact revision</text><rect x="1395" y="185" width="165" height="170" rx="22" fill="#0F172A" stroke="#334155" stroke-width="2"/><text x="1477" y="239" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Production</text><text x="1477" y="267" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">verification</text><line x1="1430" y1="285" x2="1524" y2="285" stroke="#64748B"/><text x="1477" y="313" text-anchor="middle" font-size="14" fill="#CBD5E1">Revision · health</text><text x="1477" y="336" text-anchor="middle" font-size="14" fill="#CBD5E1">smoke · live sources</text></g><g stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M245 270 H265"/><path d="M465 270 H485"/><path d="M685 270 H705"/><path d="M925 270 H945"/><path d="M1155 270 H1175"/><path d="M1365 270 H1385"/></g><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="530" y="435" width="580" height="105" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="820" y="475" text-anchor="middle" font-size="21" font-weight="700" fill="#9A3412">Focused remediation loop</text><text x="820" y="508" text-anchor="middle" font-size="16" fill="#9A3412">Preserve the failure · find the root cause · add regression evidence · rerun the same gates</text><path d="M820 355 V425" stroke="#D97706" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowAmber)"/><path d="M530 487 H370 C340 487 330 465 330 435 V345" stroke="#D97706" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowAmber)"/><text x="820" y="582" text-anchor="middle" font-size="16" fill="#64748B">PRD-001 followed this loop from readiness failure to verified production remediation.</text></g></svg>