<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Civic Utility Monitor runtime responsibilities</title><desc id="desc">A high-level architecture showing public sources, source workers, a public API, PostgreSQL, Redis, an internal delivery boundary, and an external messaging provider.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#F0FDFA"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker><marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" rx="32" fill="url(#bg)"/><text x="80" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">Runtime responsibilities and trust boundaries</text><text x="80" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">A deliberately abstract view: operational hosts, routes, credentials, network layout, and provider mechanics are not disclosed.</text><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="60" y="150" width="1480" height="650" rx="28" fill="#FFFFFF" fill-opacity=".72" stroke="#CBD5E1" stroke-width="2"/><text x="92" y="190" font-size="17" font-weight="700" fill="#64748B" letter-spacing="2">CIVIC PRODUCT BOUNDARY</text><rect x="80" y="230" width="280" height="150" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="220" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8" letter-spacing="1.5">UNTRUSTED INPUT</text><text x="220" y="316" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Public sources</text><text x="220" y="347" text-anchor="middle" font-size="16" fill="#475569">Electricity and water notices</text><rect x="430" y="230" width="300" height="150" rx="22" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/><text x="580" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#047857" letter-spacing="1.5">COLLECTION</text><text x="580" y="316" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Worker + adapters</text><text x="580" y="347" text-anchor="middle" font-size="16" fill="#475569">Validate, preserve uncertainty</text><rect x="90" y="495" width="300" height="160" rx="22" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="240" y="539" text-anchor="middle" font-size="16" font-weight="700" fill="#475569" letter-spacing="1.5">PUBLIC ACCESS</text><text x="240" y="582" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Public API</text><text x="240" y="615" text-anchor="middle" font-size="16" fill="#475569">Registration, member, product UI</text><rect x="510" y="455" width="360" height="240" rx="26" fill="#0F766E" stroke="#115E59" stroke-width="2"/><text x="690" y="500" text-anchor="middle" font-size="16" font-weight="700" fill="#CCFBF1" letter-spacing="1.5">CANONICAL PRODUCT STATE</text><text x="690" y="548" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">PostgreSQL</text><text x="690" y="589" text-anchor="middle" font-size="17" fill="#CCFBF1">Residents · notices · matches</text><text x="690" y="619" text-anchor="middle" font-size="17" fill="#CCFBF1">notifications · delivery lifecycle</text><line x1="560" y1="643" x2="820" y2="643" stroke="#5EEAD4" stroke-opacity=".45"/><text x="690" y="671" text-anchor="middle" font-size="15" fill="#CCFBF1">Persistent identities and idempotency boundaries</text><rect x="955" y="475" width="280" height="200" rx="24" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/><text x="1095" y="519" text-anchor="middle" font-size="16" font-weight="700" fill="#6D28D9" letter-spacing="1.5">BOUNDED STATE</text><text x="1095" y="561" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">Redis</text><text x="1095" y="598" text-anchor="middle" font-size="16" fill="#475569">Opaque sessions</text><text x="1095" y="624" text-anchor="middle" font-size="16" fill="#475569">abuse controls · TTL artifacts</text><rect x="975" y="230" width="310" height="150" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="1130" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#C2410C" letter-spacing="1.5">NARROW INTERNAL BOUNDARY</text><text x="1130" y="316" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">Approved delivery events</text><text x="1130" y="347" text-anchor="middle" font-size="16" fill="#475569">Product policy stays inside Civic</text><rect x="1345" y="230" width="165" height="150" rx="22" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><text x="1427" y="283" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">EXTERNAL</text><text x="1427" y="316" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Messaging</text><text x="1427" y="345" text-anchor="middle" font-size="15" fill="#475569">Transport</text><rect x="1290" y="495" width="220" height="160" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="1400" y="539" text-anchor="middle" font-size="16" font-weight="700" fill="#1D4ED8" letter-spacing="1.5">PUBLIC USER</text><text x="1400" y="582" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Resident</text><text x="1400" y="615" text-anchor="middle" font-size="16" fill="#475569">Possible-impact alert</text></g><g fill="none" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"><path d="M360 305 H420"/><path d="M580 380 V435 C580 448 590 455 603 455"/><path d="M390 575 H500"/><path d="M690 455 V414 C690 398 706 390 722 390 H1110 C1122 390 1130 382 1130 370"/><path d="M1285 305 H1335"/><path d="M1427 380 V485"/></g><g fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowSlate)"><path d="M390 620 V705 H1095 V685"/></g><text x="742" y="728" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#64748B">sessions and abuse-control state</text><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="95" y="735" width="1410" height="42" rx="14" fill="#F1F5F9"/><text x="800" y="762" text-anchor="middle" font-size="16" fill="#475569">Canonical records stay in PostgreSQL; Redis is bounded and ephemeral; external transport does not define eligibility or message meaning.</text></g></svg>