<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">Civic Utility Monitor product flow</title><desc id="desc">Public utility notices pass through source adapters, a normalized notice model, conservative street matching, persistent notification state, a delivery boundary, and finally reach a resident.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#ECFEFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker><marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker></defs><rect width="1600" height="520" rx="32" fill="url(#bg)"/><text x="80" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0F172A">From public notice to resident-facing state</text><text x="80" y="116" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">The pipeline preserves source uncertainty and stops before individual delivery when street identity is not sufficiently precise.</text><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="70" y="190" width="190" height="150" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="165" cy="228" r="24" fill="#E0F2FE"/><path d="M151 228h28M165 214v28" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/><text x="165" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Public utility</text><text x="165" y="312" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">notice</text><rect x="305" y="190" width="190" height="150" rx="20" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><circle cx="400" cy="228" r="24" fill="#CCFBF1"/><path d="M386 221h28M386 228h28M386 235h18" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/><text x="400" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Source</text><text x="400" y="312" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">adapter</text><rect x="540" y="190" width="190" height="150" rx="20" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/><circle cx="635" cy="228" r="24" fill="#CCFBF1"/><path d="M621 219h28v20h-28zM627 213h16" fill="none" stroke="#0F766E" stroke-width="3" stroke-linejoin="round"/><text x="635" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Normalized</text><text x="635" y="312" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">notice</text><rect x="775" y="170" width="230" height="190" rx="22" fill="#0F766E" stroke="#115E59" stroke-width="2"/><circle cx="890" cy="215" r="26" fill="#FFFFFF" fill-opacity=".16"/><path d="M878 215l8 8 17-19" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="890" y="273" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">Conservative</text><text x="890" y="303" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">street matching</text><text x="890" y="334" text-anchor="middle" font-size="16" fill="#CCFBF1">Fail closed on ambiguity</text><rect x="1050" y="190" width="190" height="150" rx="20" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/><circle cx="1145" cy="228" r="24" fill="#FEF3C7"/><path d="M1132 218h26v22h-26zM1137 213h16" fill="none" stroke="#B45309" stroke-width="3" stroke-linejoin="round"/><text x="1145" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Persistent</text><text x="1145" y="312" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">notification</text><rect x="1285" y="190" width="245" height="150" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><circle cx="1344" cy="228" r="24" fill="#E2E8F0"/><path d="M1332 228h24M1344 216v24" stroke="#475569" stroke-width="3" stroke-linecap="round"/><text x="1418" y="277" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Delivery boundary</text><text x="1418" y="307" text-anchor="middle" font-size="16" fill="#475569">Transport remains external</text></g><g stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M260 265 H295"/><path d="M495 265 H530"/><path d="M730 265 H765"/><path d="M1005 265 H1040"/><path d="M1240 265 H1275"/></g><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="760" y="405" width="260" height="58" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="890" y="431" text-anchor="middle" font-size="16" font-weight="700" fill="#9A3412">Insufficient precision</text><text x="890" y="453" text-anchor="middle" font-size="15" fill="#9A3412">No individual resident alert</text><path d="M890 360 V395" stroke="#EA580C" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowAmber)"/><text x="1410" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Resident</text><circle cx="1410" cy="445" r="34" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/><circle cx="1410" cy="435" r="9" fill="#1D4ED8"/><path d="M1392 459c4-13 12-19 18-19s14 6 18 19" fill="#1D4ED8"/><path d="M1410 340 V402" stroke="#0F766E" stroke-width="4" fill="none" marker-end="url(#arrow)"/></g></svg>